[project]
name = "vault-ai"
version = "0.1.0"
description = "AI-powered document vault: upload documents, get AI insights, chat with them (RAG) with page-level citations."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  # API
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.32",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  # Database
  "sqlalchemy[asyncio]==2.0.54",
  "psycopg[binary,pool]==3.3.6",
  "alembic==1.20.0",
  "pgvector==0.5.1",
  # Queue + cache
  "celery[redis]==5.6.3",
  "kombu==5.6.2",
  "redis>=6.4,<6.5",            # kombu 5.6.2 caps redis-py below 6.5
  # AI
  "openai==3.29.0",
  "tiktoken==0.14.0",
  "langchain-text-splitters==1.1.3",
  # Files + storage
  "pypdf==6.20.1",
  "python-docx==1.2.0",
  "boto3>=1.40",
  # Observability
  "structlog==26.1.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx",
  "ruff",
  "fpdf2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]
