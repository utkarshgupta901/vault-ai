# Vault AI — local stack. Every stateful service here is project-owned (named volumes, non-default host ports),
# so nothing touches other Postgres/Redis instances on this machine.
#
#   docker compose up -d --build        # dev: compose.override.yaml is merged automatically (bind mounts + reload)
#   docker compose -f compose.yaml up -d # demo: the built image only, no reload, no bind mounts
#
# Host ports: API_PORT, PG_PORT, VALKEY_PORT, S3_PORT move a published port when the default is taken on this machine
# (unset, they resolve to exactly the ports below). Only the host side changes: containers still reach each other on
# the service ports. Host-side tools (make, pytest, scripts) must follow; .env.example says how.
# They move THIS stack: the project name is pinned below, so `make up` with other ports, from any checkout, recreates
# the running vault-ai containers on them (the taken port is often vault-ai's own). A second, separate stack also needs
# COMPOSE_PROJECT_NAME=<other> (its own containers and volumes). It still shares the vault-ai:latest image tag: a build
# there retags the image that a later `make demo-luna` (no --build) here would start.
name: vault-ai

x-app: &app
  build: .
  image: vault-ai:latest
  env_file:
    - path: .env
      required: false
  environment: &app-env
    APP_ENV: local
    DATABASE_URL: postgresql+psycopg://vault:vault@postgres:5432/vault
    BROKER_URL: redis://valkey:6379/0
    CACHE_URL: redis://valkey:6379/1
    S3_ENDPOINT_URL: http://s3:9000
    S3_ACCESS_KEY_ID: vaultlocal
    S3_SECRET_ACCESS_KEY: vaultlocalsecret
    S3_BUCKET: vault-uploads
    S3_REGION: us-east-1
  restart: unless-stopped

x-depends: &depends
  postgres: { condition: service_healthy }
  valkey: { condition: service_healthy }
  s3: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg17          # Postgres 17 + pgvector, same major version as Render
    environment: { POSTGRES_USER: vault, POSTGRES_PASSWORD: vault, POSTGRES_DB: vault }
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    ports: ["${PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vault -d vault"], interval: 3s, timeout: 3s, retries: 30 }
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine          # Redis-compatible; Render "Key Value" runs Valkey 8
    # db0 = Celery broker, db1 = cache + rate-limit counters.
    # AOF keeps queued tasks across restarts; noeviction (with maxmemory) means broker keys are never evicted.
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["${VALKEY_PORT:-6380}:6379"]
    volumes: [valkeydata:/data]
    healthcheck: { test: ["CMD", "valkey-cli", "ping"], interval: 3s, timeout: 3s, retries: 30 }
    restart: unless-stopped

  s3:
    image: rustfs/rustfs:1.0.1             # S3-compatible object store (Cloudflare R2 / AWS S3 in the cloud)
    environment: { RUSTFS_ACCESS_KEY: vaultlocal, RUSTFS_SECRET_KEY: vaultlocalsecret }
    ports: ["${S3_PORT:-9200}:9000"]
    volumes: [s3data:/data]
    healthcheck: { test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"], interval: 3s, timeout: 3s, retries: 30 }
    restart: unless-stopped

  migrate:                                 # one-shot: alembic upgrade head + create bucket + seed API users
    <<: *app
    command: ["python", "-m", "app.cli", "bootstrap"]
    depends_on: *depends
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *app-env
      # Interpolated so `make demo-luna` can switch the answer model for the API alone without editing .env.
      # Precedence: shell env > .env > the default here (the same default as app/config.py).
      ANSWER_MODEL: ${ANSWER_MODEL:-gpt-6.1-sol}
      ANSWER_EFFORT: ${ANSWER_EFFORT:-low}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      <<: *depends
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"], interval: 5s, timeout: 3s, retries: 20 }

  worker-ingest:                           # extract -> chunk -> embed (CPU + embeddings API)
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "ingest", "-c", "2", "-n", "ingest@%h",
              "--max-memory-per-child=400000", "--loglevel=INFO"]
    depends_on:
      <<: *depends
      migrate: { condition: service_completed_successfully }
    mem_limit: 1g
    stop_grace_period: 60s

  worker-ai:                               # LLM insights (I/O-bound, separate queue so it never blocks ingestion)
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "ai", "-c", "4", "-n", "ai@%h", "--loglevel=INFO"]
    depends_on:
      <<: *depends
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 60s

volumes:
  pgdata:
  valkeydata:
  s3data:
